name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML files exist
        run: |
          for f in index.html submit.html; do
            if [ ! -f "$f" ]; then
              echo "Error: $f not found"
              exit 1
            fi
            echo "✓ $f exists"
          done

      - name: Validate JS syntax
        run: |
          if [ -f _functions/portal.js ]; then
            node --check _functions/portal.js && echo "✓ portal.js syntax OK" || exit 1
          fi
          if [ -f _functions/lib.js ]; then
            node --check _functions/lib.js && echo "✓ lib.js syntax OK" || exit 1
          fi

      - name: Check athletes data in index.html
        run: |
          if grep -q 'const athletes' index.html; then
            echo "✓ athletes data block found"
          else
            echo "Error: no athletes data in index.html"
            exit 1
          fi
          echo "All validations passed ✓"
