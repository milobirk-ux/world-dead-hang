<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Minimal Test</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .verified-badge { color: green; }
        .pr-badge { color: orange; }
    </style>
</head>
<body>
    <h2>Template literal test:</h2>
    <div id="test1"></div>
    <div id="test2"></div>
    
    <h2>Direct symbol test:</h2>
    <div>✓ Checkmark</div>
    <div>⚡ Lightning</div>
    <div>🇺🇸 US Flag</div>
    
    <script>
        // Test template literals like in the actual code
        const athlete = { isVerified: true, prCount: 3 };
        
        document.getElementById('test1').innerHTML = 
            `${athlete.isVerified ? `<span class="verified-badge" title="Pro-Level Verification">✓</span>` : ''}`;
        
        document.getElementById('test2').innerHTML = 
            `<div class="pr-badge"><span class="pr-val">⚡ ${athlete.prCount}</span></div>`;
    </script>
</body>
</html>
