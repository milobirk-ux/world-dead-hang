            try {

                state.isRefreshing = false;
                
            } catch (error) {

                document.getElementById('statusBadge').textContent = 'Error';
                state.isRefreshing = false;
            }

        // Mock data generation
        function generateMockData() {
            const countries = ['US', 'CA', 'GB', 'AU', 'DE', 'FR', 'JP', 'BR', 'IN', 'RU', 'CN', 'MX', 'IT', 'ES', 'KR'];
            const tiers = ['freak', 'legend', 'elite', 'challenger'];
            const tierNames = {
                'freak': 'Freak',
                'legend': 'Legend', 
                'elite': 'Elite',
                'challenger': 'Challenger'
            };
            
            const submissions = [];
            const now = new Date();
            
            // Generate 50 submissions over the last 90 days
            for (let i = 0; i < 50; i++) {
                const daysAgo = Math.floor(Math.random() * 90);
                const date = new Date(now);
                date.setDate(date.getDate() - daysAgo);
                
                const timeMinutes = Math.floor(Math.random() * 3);
                const timeSeconds = Math.floor(Math.random() * 60);
                const time = `${timeMinutes}:${timeSeconds.toString().padStart(2, '0')}`;
                
                const tier = tiers[Math.floor(Math.random() * tiers.length)];
                const gripAge = (Math.random() * 10 + 20).toFixed(1);
                const country = countries[Math.floor(Math.random() * countries.length)];
                const verified = Math.random() > 0.3;
                
                submissions.push({
                    id: i + 1,
                    name: `Athlete ${i + 1}`,
                    time: time,
                    tier: tier,
                    tierName: tierNames[tier],
                    gripAge: gripAge,
                    country: country,
                    verified: verified,
                    date: date,
                    timestamp: date.getTime()
                });
            }
            
            // Sort by date (newest first)
            submissions.sort((a, b) => b.timestamp - a.timestamp);
            
            return {
                submissions: submissions,
                stats: {
                    total: submissions.length,
                    verified: submissions.filter(s => s.verified).length,
                    avgTime: '1:45',
                    countries: new Set(submissions.map(s => s.country)).size,
                    tierDistribution: {
                        freak: submissions.filter(s => s.tier === 'freak').length,
                        legend: submissions.filter(s => s.tier === 'legend').length,
                        elite: submissions.filter(s => s.tier === 'elite').length,
                        challenger: submissions.filter(s => s.tier === 'challenger').length
                    }
                }
            };
        }

            const filterStatus = document.getElementById('filterStatus').value;
            
            let filtered = state.data.submissions;
            
            // Apply filters
            if (searchTerm) {
                filtered = filtered.filter(s => 
                    s.name.toLowerCase().includes(searchTerm) ||
                    s.country.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filterTier !== 'all') {
                filtered = filtered.filter(s => s.tier === filterTier);
            }
            
            if (filterStatus === 'verified') {
                filtered = filtered.filter(s => s.verified);
            } else if (filterStatus === 'pending') {
                filtered = filtered.filter(s => !s.verified);
            }
            
            // Render table rows
            tableBody.innerHTML = '';
            filtered.slice(0, 20).forEach(submission => {
                const row = document.createElement('tr');
                
                const dateStr = submission.date.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'

                row.innerHTML = `

                    <td><span class="tier-badge tier-${submission.tier}">${submission.tierName}</span></td>
                    <td>${submission.gripAge}</td>
                    <td>${submission.country}</td>
                    <td class="${submission.verified ? 'verified-badge' : ''}">

                    <td>${dateStr}</td>

            });
        }
